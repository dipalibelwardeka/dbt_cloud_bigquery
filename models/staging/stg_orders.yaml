version: 2

models:
  - name: stg_orders
    description: "Cleaned and transformed orders data"

    columns:
      - name: order_id
        description: "Unique order identifier"
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer who placed the order"
        data_tests:
          - not_null

      - name: order_date
        description: "Date the order was placed"
        data_tests:
          - not_null

      - name: order_status
        description: "Standardized order status"
        data_tests:
          - not_null